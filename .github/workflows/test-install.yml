name: Installation
on:
  schedule:
    - cron: "0 0 1 * *"  # First day of the month

jobs:
  run:
    name: Installation on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow --tags
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pip
      run: |
        python -m pip install --upgrade pip
        pip3 install packaging
    - name: Install package
      run: |
        pip install -r src/lerner_lab_to_nwb/seiler_2024/seiler_2024_requirements.txt
        pip install -e . --no-deps
    - name: Test module load
      uses: jannekem/run-python-script-action@v1
      with:
        script: import lerner_lab_to_nwb.seiler_2024
